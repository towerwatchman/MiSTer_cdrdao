name: Build CDRDAO for MiSTer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: write-all

jobs:
  build_mister_cdrdao:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    env:
      CDRDAO_VERSION: 1.2.5
      CDRDAO_RELEASE: rel_1_2_5
      GCC_VERSION: 10.2-2020.11

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          apt-get update
          dpkg --add-architecture i386
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          echo "tzdata tzdata/Areas select Etc" | debconf-set-selections
          echo "tzdata tzdata/Zones/Etc select UTC" | debconf-set-selections
          apt-get install -y -qq \
            binfmt-support qemu-user-static autoconf bc bison build-essential curl wget \
            flex gcc git libelf-dev libgmp3-dev libiberty-dev liblz4-tool libmpc-dev \
            libncurses-dev libncurses5-dev libpci-dev libssl-dev libudev-dev lzop \
            openssl qemu-user sharutils u-boot-tools unzip libc6:i386 libstdc++6:i386

      - name: Setup QEMU for ARM
        run: |
          cp /usr/bin/qemu-arm-static /usr/local/bin/
          update-binfmts --install qemu-arm /usr/local/bin/qemu-arm-static \
            --magic "\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00" \
            --mask "\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff" || true

      - name: Install Linaro GCC 10.2
        run: |
          wget -q -c https://developer.arm.com/-/media/Files/downloads/gnu-a/${GCC_VERSION}/binrel/gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf.tar.xz
          mkdir -p /opt
          tar xf gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf.tar.xz -C /opt
          rm gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf.tar.xz
          arm-none-linux-gnueabihf-gcc --version

      - name: Setup ARM Library Symlinks
        run: |
          ln -sf /opt/gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/arm-none-linux-gnueabihf/libc/lib/ld-linux-armhf.so.3 /lib/ld-linux-armhf.so.3
          ln -sf /opt/gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/arm-none-linux-gnueabihf/libc/lib/libc.so.6 /lib/libc.so.6
          ln -sf /opt/gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/arm-none-linux-gnueabihf/libc/lib/libpthread.so.0 /lib/libpthread.so.0

      - name: Build CDRDAO
        run: |
          STARTDIR=$PWD
          wget -q https://github.com/cdrdao/cdrdao/releases/download/${CDRDAO_RELEASE}/cdrdao-${CDRDAO_VERSION}.tar.bz2
          tar xf cdrdao-${CDRDAO_VERSION}.tar.bz2
          cd cdrdao-${CDRDAO_VERSION}
          make -C pccts CC=gcc CXX=g++ CFLAGS="-g -O2 -pthread" LDFLAGS="-pthread"
          export PATH=/opt/gcc-arm-${GCC_VERSION}-x86_64-arm-none-linux-gnueabihf/bin:$PATH
          ./configure --host=arm-none-linux-gnueabihf
          make -j$(nproc)
          mkdir -p $STARTDIR/Scripts/.config/mister-cdrdao
          mv -v ./dao/cdrdao ./utils/toc2cue $STARTDIR/Scripts/.config/mister-cdrdao
          cd $STARTDIR
          rm -rf cdrdao-${CDRDAO_VERSION} cdrdao-${CDRDAO_VERSION}.tar.bz2

      - name: Create Install Script
        run: |
          mkdir -p Scripts
          cat > Scripts/install_cdrdao.sh << 'EOL'
          #!/bin/sh
          # Installs cdrdao and toc2cue to /usr/bin/ on MiSTer
          # Run this script manually from the Scripts directory

          echo "Installing cdrdao and toc2cue to /usr/bin/"

          # Check if running on MiSTer (basic check for /media/fat)
          if [ ! -d "/media/fat" ]; then
              echo "Error: This script is intended to run on a MiSTer system."
              exit 1
          fi

          # Check if the binaries exist in the current directory
          if [ ! -f "/media/fat/_Utility/cdrdao" ] || [ ! -f "/media/fat/_Utility/toc2cue" ]; then
              echo "Error: cdrdao or toc2cue not found in /media/fat/_Utility/"
              exit 1
          fi

          # Copy binaries to /usr/bin/ with executable permissions
          echo "Copying cdrdao to /usr/bin/"
          cp /media/fat/_Utility/cdrdao /usr/bin/cdrdao
          chmod +x /usr/bin/cdrdao

          echo "Copying toc2cue to /usr/bin/"
          cp /media/fat/_Utility/toc2cue /usr/bin/toc2cue
          chmod +x /usr/bin/toc2cue

          echo "Installation complete! cdrdao and toc2cue are now in /usr/bin/"
          EOL
          chmod +x Scripts/install_cdrdao.sh

      - name: Verify Build
        run: |
          cd Scripts/.config/mister-cdrdao
          file cdrdao
          file toc2cue
          ldd cdrdao || true
          strings cdrdao | grep -i gcc || true

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          cp Scripts/.config/mister-cdrdao/cdrdao artifacts/
          cp Scripts/.config/mister-cdrdao/toc2cue artifacts/
          cp Scripts/install_cdrdao.sh artifacts/
          tar -czf cdrdao-mister.tar.gz -C artifacts .

      - name: Generate Database JSON
        run: |
          cat > mister_cdrdao_db.json << EOL
          {
            "db_id": "mister_cdrdao",
            "timestamp": $(date +%s),
            "files": {
              "_Utility/cdrdao": {
                "hash": "$(md5sum Scripts/.config/mister-cdrdao/cdrdao | cut -d' ' -f1)",
                "size": $(wc -c < Scripts/.config/mister-cdrdao/cdrdao),
                "url": "https://raw.githubusercontent.com/towerwatchman/MiSTer_cdrdao/main/Scripts/.config/mister-cdrdao/cdrdao",
                "tags": ["cdrdao", "utility"],
                "overwrite": true,
                "reboot": false
              },
              "_Utility/toc2cue": {
                "hash": "$(md5sum Scripts/.config/mister-cdrdao/toc2cue | cut -d' ' -f1)",
                "size": $(wc -c < Scripts/.config/mister-cdrdao/toc2cue),
                "url": "https://raw.githubusercontent.com/towerwatchman/MiSTer_cdrdao/main/Scripts/.config/mister-cdrdao/toc2cue",
                "tags": ["cdrdao", "utility"],
                "overwrite": true,
                "reboot": false
              },
              "Scripts/install_cdrdao.sh": {
                "hash": "$(md5sum Scripts/install_cdrdao.sh | cut -d' ' -f1)",
                "size": $(wc -c < Scripts/install_cdrdao.sh),
                "url": "https://raw.githubusercontent.com/towerwatchman/MiSTer_cdrdao/main/Scripts/install_cdrdao.sh",
                "tags": ["cdrdao", "utility", "script"],
                "overwrite": true,
                "reboot": false
              }
            },
            "folders": {
              "_Utility": {
                "tags": ["cdrdao"]
              },
              "Scripts": {
                "tags": ["cdrdao", "script"]
              }
            },
            "default_options": {
              "filter": "cdrdao"
            }
          }
          EOL

      - name: Create db Directory and Move JSON file
        run: |
          mkdir -p db
          mv mister_cdrdao_db.json db/

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Scripts/.config/mister-cdrdao/*
          git add Scripts/install_cdrdao.sh
          git add db/mister_cdrdao_db.json
          git commit -m "Update cdrdao, toc2cue, install_cdrdao.sh, and mister_cdrdao_db.json for $GITHUB_SHA" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdrdao-mister
          path: cdrdao-mister.tar.gz
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="v${CDRDAO_VERSION}-mister-$(date +%Y%m%d)"
          echo "Attempting to create or update release with tag: $TAG"
          gh release create "$TAG" \
            --title "cdrdao ${CDRDAO_VERSION} for MiSTer" \
            --notes "Built for MiSTer FPGA (ARM). Includes cdrdao, toc2cue binaries, and install script." \
            --draft=false \
            cdrdao-mister.tar.gz || \
          gh release upload "$TAG" cdrdao-mister.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}